name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      authorizer_version:
        description: "Authorizer base image version (quay.io/authorizer/authorizer:<version>). Empty = Dockerfile default."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Docker Hub, next to the main image (docker.io/lakhansamani/authorizer).
  # Docker Hub repositories are public, so deploy buttons can pull anonymously.
  IMAGE: docker.io/lakhansamani/authorizer-oneclick

jobs:
  build:
    name: Smoke test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions and tags
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.authorizer_version }}
        run: |
          default=$(sed -n 's/^ARG AUTHORIZER_VERSION=//p' Dockerfile)
          version=${INPUT_VERSION:-$default}
          case "$version" in
            *[!0-9A-Za-z.-]*|"") echo "invalid version: $version" >&2; exit 1 ;;
          esac
          tags="$IMAGE:$version,$IMAGE:sha-${GITHUB_SHA::12}"
          # Only the Dockerfile's pinned version moves `latest`, so a manual
          # rebuild of an older base does not roll `latest` back.
          if [ "$version" = "$default" ]; then tags="$tags,$IMAGE:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Base version: $version"; echo "Tags: $tags"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for smoke test (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: AUTHORIZER_VERSION=${{ steps.meta.outputs.version }}
          load: true
          tags: authorizer-oneclick:smoke

      - name: Smoke test (zero env, restart on same volume, explicit secrets)
        run: ./scripts/smoke.sh authorizer-oneclick:smoke

      - name: Check Docker Hub credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::DOCKER_USERNAME / DOCKER_PASSWORD repo secrets are not set; cannot publish to Docker Hub." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (linux/amd64, linux/arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: AUTHORIZER_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
